# Onboarding Agent Finite State Machine Definition
# This file documents all states, transitions, triggers, and tool calls for the volunteer onboarding flow

metadata:
  name: "SERVE Volunteer Onboarding Agent"
  version: "2.0"
  description: "WhatsApp-based onboarding conversation flow for volunteer teachers"
  entry_point: "WELCOME"
  last_updated: "2025-01-01"
  notes: "Updated to match actual implementation: INTENT, ELIGIBILITY (single), IDENTITY, PREFERENCES states"

states:
  WELCOME:
    description: "Initial greeting, SERVE introduction, and consent collection"
    entry_trigger: "__kick__" | "first_inbound_message"
    substeps:
      - name: "greet"
        action: "send_welcome_messages"
        tools: ["wa.send_message"]
        messages:
          - "Hey {name}! I'm Sia from the SERVE team..."
          - "Before we move ahead... Shall we continue?"
      - name: "await_continue"
        action: "wait_for_user_reply"
        triggers:
          - "CONSENT_YES" -> "shared_info"
          - "CONSENT_NO" -> "REJECTED"
          - "QUERY" -> "answer_faq"
          - "DEFERRAL" -> "DEFERRED"
          - "STOP" -> "OPTOUT"
          - "RETURNING" -> "fast_forward"
          - "AMBIGUOUS" -> "clarify"
        parsing:
          - rule_based: ["is_yes_response", "is_no_response"]
          - llm_tool: "onboarding.parse_message"
          - fallback: "llm.classify_response"
      - name: "shared_info"
        action: "send_serve_info_and_consent"
        tools: ["wa.send_message"]
        messages:
          - "SERVE has helped thousands..."
          - "Just to be clear — this is a volunteer opportunity..."
    
    transitions:
      - from: "WELCOME"
        to: "INTENT"
        trigger: "CONSENT_YES"
        condition: "consent.value == 'yes'"
        tools: ["consent.record", "state.advance"]
        action: "record_consent_and_advance"
      
      - from: "WELCOME"
        to: "REJECTED"
        trigger: "CONSENT_NO"
        condition: "consent.value == 'no'"
        action: "decline_politely"
      
      - from: "WELCOME"
        to: "DEFERRED"
        trigger: "DEFERRAL"
        tools: ["deferral.create"]
        action: "create_deferral_and_exit"
      
      - from: "WELCOME"
        to: "OPTOUT"
        trigger: "STOP"
        action: "acknowledge_stop"
      
      - from: "WELCOME"
        to: "<existing_state>"
        trigger: "RETURNING"
        tools: ["state.get"]
        action: "fast_forward_to_existing_state"

  INTENT:
    description: "Commitment check - 2 hours/week comfort"
    entry_trigger: "consent_recorded"
    
    question: "Would you be comfortable teaching around 2 hours a week?"
    parsing:
      - rule_based: ["classify_intent_rule_based"]
      - llm_fallback: "mcp_llm_classify_intent" (only when needed)
    validation:
      - rule_first: true
      - llm_only_when: ["ambiguous", "mixed_signals", "long_message"]
    tools: ["onboarding.parse_message", "llm.classify_intent"]
    
    transitions:
      - from: "INTENT"
        to: "ELIGIBILITY"
        trigger: "TIME_YES"
        condition: "intent == TIME_YES"
        action: "proceed_to_eligibility"
      
      - from: "INTENT"
        to: "ELIGIBILITY"
        trigger: "TIME_MAYBE"
        condition: "intent == TIME_MAYBE"
        action: "proceed_to_eligibility"
      
      - from: "INTENT"
        to: "INTENT"
        trigger: "TIME_NO"
        condition: "intent == TIME_NO && !persuasion_sent"
        action: "send_persuasion"
      
      - from: "INTENT"
        to: "REJECTED"
        trigger: "TIME_NO_AFTER_PERSUASION"
        condition: "intent == TIME_NO && persuasion_sent"
        action: "exit_with_community_link"
      
      - from: "INTENT"
        to: "REJECTED"
        trigger: "DEFERRAL"
        condition: "intent == DEFERRAL"
        action: "exit_with_community_link"
      
      - from: "INTENT"
        to: "INTENT"
        trigger: "QUERY"
        condition: "intent == QUERY"
        action: "answer_faq_and_reask"

  ELIGIBILITY:
    description: "Three non-negotiable requirements check: 18+, device+internet, unpaid understanding"
    entry_trigger: "intent_confirmed"
    
    question: "Are all three okay for you?"
    requirements:
      - "18 or above"
      - "Tablet or laptop with Internet"
      - "Understands this is a voluntary role (no payment)"
    parsing:
      - rule_based: ["classify_eligibility_rule_based"]
      - llm_fallback: "mcp_llm_classify_intent" (only when needed)
    validation:
      - strict: true
      - no_persuasion: true
      - any_fail: "REJECTED"
    tools: ["onboarding.parse_message", "llm.classify_intent"]
    
    transitions:
      - from: "ELIGIBILITY"
        to: "IDENTITY"
        trigger: "ELIGIBLE_YES"
        condition: "intent == ELIGIBLE_YES"
        action: "proceed_to_identity"
      
      - from: "ELIGIBILITY"
        to: "REJECTED"
        trigger: "ELIGIBLE_NO"
        condition: "intent == ELIGIBLE_NO"
        action: "exit_with_community_link"
      
      - from: "ELIGIBILITY"
        to: "ELIGIBILITY"
        trigger: "ELIGIBLE_UNCLEAR"
        condition: "intent == ELIGIBLE_UNCLEAR"
        action: "ask_clarification"
      
      - from: "ELIGIBILITY"
        to: "ELIGIBILITY"
        trigger: "QUERY"
        condition: "intent == QUERY"
        action: "answer_faq_and_reask"

  IDENTITY:
    description: "Collect name, phone number, and email"
    entry_trigger: "eligibility_confirmed"
    
    substeps:
      - name: "name_collection"
        question: "btw, may I know your **name**? 🙂"
        parsing:
          - rule_based: ["extract_name", "classify_name_response"]
          - llm_fallback: "mcp_llm_classify_intent" (only when needed)
        validation:
          - min_length: 2
          - max_length: 100
          - alphabetic: true
        tools: ["onboarding.parse_message", "llm.classify_intent"]
      
      - name: "contacts_collection"
        question: "Could you share your **phone number** and **email**?"
        parsing:
          - rule_based: ["extract_phone", "extract_email", "classify_contacts_response"]
          - llm_fallback: "mcp_llm_classify_intent" (only when needed)
        validation:
          - phone_required: true
          - email_required: true
          - on_refusal: "nudge_once_then_exit"
        tools: ["onboarding.parse_message", "llm.classify_intent", "saveProfile"]
    
    transitions:
      - from: "IDENTITY"
        to: "PREFERENCES"
        trigger: "CONTACTS_OK"
        condition: "phone && email && saveProfile_success"
        action: "proceed_to_preferences"
      
      - from: "IDENTITY"
        to: "IDENTITY"
        trigger: "CONTACTS_PARTIAL"
        condition: "phone || email (but not both)"
        action: "ask_missing_field"
      
      - from: "IDENTITY"
        to: "IDENTITY"
        trigger: "REFUSE_CONTACTS"
        condition: "refusal && !nudge_sent"
        action: "send_nudge"
      
      - from: "IDENTITY"
        to: "REJECTED"
        trigger: "REFUSE_CONTACTS_AFTER_NUDGE"
        condition: "refusal && nudge_sent"
        action: "exit_with_community_link"
      
      - from: "IDENTITY"
        to: "IDENTITY"
        trigger: "QUERY"
        condition: "intent == QUERY"
        action: "answer_faq_and_reask"
      
      - from: "IDENTITY"
        to: "IDENTITY"
        trigger: "NAME_UNCLEAR"
        condition: "intent == NAME_UNCLEAR"
        action: "reask_name"

  PREFERENCES:
    description: "Collect teaching day and time preferences"
    entry_trigger: "identity_complete"
    
    substeps:
      - name: "days_collection"
        question: "Which days work best for you?"
        parsing:
          - llm_tool: "_generate_prefs_interpretation"
          - field: "preferences.days"
          - expand: ["weekdays", "weekends"]
        validation:
          - policy_check: "policy.scheduling.weekend_gate"
          - on_weekend_only: "note_limitation"
      
      - name: "time_collection"
        question: "What time works best?"
        parsing:
          - llm_tool: "_generate_prefs_interpretation"
          - field: "preferences.time_band"
          - expand: "time_bands_to_windows"
        validation:
          - policy_check: "8 AM - 3 PM weekday constraint"
    
    tools: ["onboarding.parse_message", "preferences.save", "policy.scheduling"]
    
    transitions:
      - from: "PREFERENCES"
        to: "QA_WINDOW"
        trigger: "preferences_saved"
        condition: "days && time_band saved (or save failed but continue)"
        action: "transition_to_qa_with_kick"

  QA_WINDOW:
    description: "Short Q&A window (max 2 turns) before orientation scheduling"
    entry_trigger: "__kick__"
    
    entry_message: "Before we wrap up, do you have any quick questions for me?"
    
    routing:
      - rule_based:
          - STOP -> "OPTOUT"
          - DEFERRAL -> "DEFERRED"
          - RETURNING -> "fast_forward"
          - FAQ_KEYWORDS -> "answer_from_cache"
      - llm_fallback:
          - tool: "knowledge.search"
          - tool: "llm.qa"
          - answer_template: "2-4 lines, end with 'Shall we schedule your orientation?'"
    
    timebox:
      - max_turns: 2
      - on_exhausted: "nudge_forward"
      - nudge_message: "Happy to answer more in orientation... orientation is mandatory..."
    
    transitions:
      # COMMENTED OUT: Orientation scheduling disabled
      # - from: "QA_WINDOW"
      #   to: "ORIENTATION_SLOT"
      #   trigger: "user_ready_to_schedule"
      #   condition: "qa_count < 2 && user_says_yes_to_scheduling"
      #   tools: ["consent.record", "state.advance"]
      #   action: "record_orientation_consent"
      # Instead, transition to COMPLETE
      - from: "QA_WINDOW"
        to: "COMPLETE"
        trigger: "user_ready_to_schedule"
        condition: "qa_count < 2 && user_says_yes_to_scheduling"
        tools: ["consent.record", "state.advance"]
        action: "record_orientation_consent"
      
      - from: "QA_WINDOW"
        to: "DEFERRED"
        trigger: "orientation_deferred"
        condition: "user_says_later_to_scheduling"
        tools: ["deferral.create"]
        action: "create_orientation_deferral"
      
      - from: "QA_WINDOW"
        to: "OPTOUT"
        trigger: "stop_detected"
        action: "acknowledge_stop"
      
      - from: "QA_WINDOW"
        to: "<existing_state>"
        trigger: "returning_user"
        tools: ["state.get"]
        action: "fast_forward_to_existing_state"
    
    tools: ["knowledge.search", "llm.qa", "deferral.create", "state.get", "consent.record"]

